[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-models-research"
version = "0.1.0"
description = "A measured, progressive world-models teaching laboratory"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.6,<2.9", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]
pretrained = ["transformers>=4.57,<5", "huggingface-hub>=0.34,<1", "safetensors>=0.6", "torchvision>=0.21,<0.24"]
rl = ["gymnasium>=1.1,<2"]

[project.scripts]
wm-lab = "world_models.lab:main"
wm-vjepa = "world_models.inference.vjepa:main"

[tool.hatch.build.targets.wheel]
packages = ["src/world_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
